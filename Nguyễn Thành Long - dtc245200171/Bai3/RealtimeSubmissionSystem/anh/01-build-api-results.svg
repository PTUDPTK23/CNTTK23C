  <text x="316" y="282" class="ln">6</text><text x="352" y="282" class="code">app.MapGet(<tspan fill="#ce9178">"/"</tspan>, () =&gt; <tspan fill="#4ec9b0">new</tspan> { service = <tspan fill="#ce9178">"PingApi"</tspan>, status = <tspan fill="#ce9178">"running"</tspan> });</text>
  <text x="316" y="311" class="ln">7</text><text x="352" y="311" class="code">app.MapHub&lt;PingHub&gt;(<tspan fill="#ce9178">"/hubs/ping"</tspan>);</text>
  <text x="316" y="340" class="ln">8</text><text x="352" y="340" class="code">app.Run();</text>
