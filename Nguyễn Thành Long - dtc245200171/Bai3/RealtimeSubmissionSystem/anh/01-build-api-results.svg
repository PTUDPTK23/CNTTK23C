  <text x="316" y="195" class="ln">3</text><text x="352" y="195" class="code"><tspan fill="#569cd6">var</tspan> builder = WebApplication.CreateBuilder(args);</text>
  <text x="316" y="224" class="ln">4</text><text x="352" y="224" class="code">builder.Services.AddSignalR();</text>
