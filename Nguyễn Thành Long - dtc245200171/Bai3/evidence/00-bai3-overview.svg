  <text x="324" y="130" class="ln">1</text><text x="357" y="130" class="mdh"># PingSignalR - Bai 3 SignalR</text>
  <text x="324" y="158" class="ln">2</text><text x="357" y="158" class="md">Bai thuc hanh tao may chu ASP.NET Core SignalR va hai client console.</text>
  <text x="324" y="203" class="ln">3</text><text x="357" y="203" class="mdh">## Yeu cau moi truong</text>
  <text x="324" y="231" class="ln">4</text><text x="357" y="231" class="md">- Windows 10/11 va .NET SDK 10.0</text>
  <text x="324" y="259" class="ln">5</text><text x="357" y="259" class="md">- PowerShell; REST Client la tuy chon</text>
  <text x="324" y="304" class="ln">6</text><text x="357" y="304" class="mdh">## Chay API va client</text>
  <text x="324" y="332" class="ln">7</text><text x="357" y="332" class="md">Terminal 1 - may chu: dotnet run --project src/Ping.Api --urls http://localhost:5200</text>
  <text x="324" y="360" class="ln">8</text><text x="357" y="360" class="md">Terminal 2/3 - client An va Binh, sau do nhap lenh echo/broadcast/group</text>
  <text x="324" y="405" class="ln">9</text><text x="357" y="405" class="mdh">## Hop dong SignalR</text>
  <text x="324" y="433" class="ln">10</text><text x="357" y="433" class="md">Echo -> Caller | Broadcast -> All | SendToGroup -> Group</text>
  <text x="324" y="478" class="ln">11</text><text x="357" y="478" class="mdh">## Anh minh chung va nop bai</text>
  <text x="324" y="506" class="ln">12</text><text x="357" y="506" class="md">Luu anh trong anh/; commit theo moc: Bai3: PingSignalR buoc 1-7</text>
