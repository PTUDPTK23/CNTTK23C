  <text x="318" y="161" class="ui" fill="#dcdcaa">AN - Client console</text>
  <text x="318" y="194" class="code"><tspan class="blue">PS</tspan> C:\Users\My-PC\Downloads\Bai3&gt; dotnet run --project src/Ping.Client -- http://localhost:5200 An</text>
  <text x="318" y="226" class="code green">An da ket noi den PingApi</text>
  <text x="318" y="254" class="code">[System] Client &lt;id&gt; da ket noi.</text>
  <text x="318" y="282" class="code">[Group] &lt;id&gt; da tham gia nhom lop-hoc-01</text>
  <text x="318" y="327" class="code"><tspan class="blue">An&gt;</tspan> broadcast Xin chao tat ca tu An</text>
  <text x="318" y="355" class="code">[Broadcast] Xin chao tat ca tu An</text>
  <text x="318" y="383" class="code">[Broadcast] Xin chao tat ca tu An</text>
  <text x="318" y="429" class="code"><tspan class="blue">An&gt;</tspan> group Thong bao nhom tu An</text>
  <text x="318" y="457" class="code">[Group] Thong bao nhom tu An</text>
  <text x="318" y="503" class="code"><tspan class="blue">An&gt;</tspan> echo Xin chao tu An</text>
  <text x="318" y="531" class="code">[Echo] Echo: Xin chao tu An</text>
  <text x="318" y="577" class="code"><tspan class="blue">An&gt;</tspan> bad</text>
  <text x="318" y="605" class="code orange">[InvocationError] Method does not exist</text>
  <text x="318" y="651" class="code green">An nhan Echo rieng, broadcast va group</text>
  <text x="318" y="693" class="code muted">Client connection established</text>
