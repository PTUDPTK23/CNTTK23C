  <text x="311" y="90" class="ui">C# PingHub.cs</text><text x="439" y="90" class="ui muted">×</text><text x="503" y="90" class="ui muted">Ping.Api  ›  PingHub.cs</text>
  <rect x="292" y="102" width="1308" height="520" fill="#1e1e1e"/>
  <text x="316" y="137" class="ln">1</text><text x="352" y="137" class="code"><tspan class="purple">public sealed class</tspan> PingHub : Hub</text>
  <text x="316" y="166" class="ln">2</text><text x="352" y="166" class="code">{</text>
  <text x="316" y="195" class="ln">3</text><text x="352" y="195" class="code">    <tspan class="purple">public async Task</tspan> Echo(<tspan class="blue">string</tspan> message)</text>
  <text x="316" y="224" class="ln">4</text><text x="352" y="224" class="code">        =&gt; <tspan class="purple">await</tspan> Clients.Caller.SendAsync(<tspan class="orange">"EchoResponse"</tspan>, message);</text>
  <text x="316" y="253" class="ln">5</text><text x="352" y="253" class="code"></text>
  <text x="316" y="282" class="ln">6</text><text x="352" y="282" class="code">    <tspan class="purple">public async Task</tspan> Broadcast(<tspan class="blue">string</tspan> message)</text>
  <text x="316" y="311" class="ln">7</text><text x="352" y="311" class="code">        =&gt; <tspan class="purple">await</tspan> Clients.All.SendAsync(<tspan class="orange">"BroadcastMessage"</tspan>, message);</text>
  <text x="316" y="340" class="ln">8</text><text x="352" y="340" class="code"></text>
  <text x="316" y="369" class="ln">9</text><text x="352" y="369" class="code">    <tspan class="purple">public async Task</tspan> SendToGroup(<tspan class="blue">string</tspan> groupName, <tspan class="blue">string</tspan> message)</text>
  <text x="316" y="398" class="ln">10</text><text x="352" y="398" class="code">        =&gt; <tspan class="purple">await</tspan> Clients.Group(groupName).SendAsync(<tspan class="orange">"GroupMessage"</tspan>, message);</text>
  <text x="316" y="427" class="ln">11</text><text x="352" y="427" class="code"></text>
  <text x="316" y="456" class="ln">12</text><text x="352" y="456" class="code">    <tspan class="purple">public async Task</tspan> SendToClient(<tspan class="blue">string</tspan> connectionId, <tspan class="blue">string</tspan> message)</text>
  <text x="316" y="485" class="ln">13</text><text x="352" y="485" class="code">        =&gt; <tspan class="purple">await</tspan> Clients.Client(connectionId).SendAsync(<tspan class="orange">"EchoResponse"</tspan>, message);</text>
  <text x="316" y="514" class="ln">14</text><text x="352" y="514" class="code">}</text>
  <rect x="292" y="622" width="1308" height="244" fill="#1e1e1e"/><rect x="292" y="622" width="1308" height="31" fill="#252526"/>
  <text x="312" y="644" class="ui muted">PROBLEMS</text><text x="416" y="644" class="ui muted">OUTPUT</text><text x="492" y="644" class="ui">TERMINAL</text>
  <rect x="490" y="650" width="73" height="2" fill="#007acc"/>
  <text x="316" y="683" class="code">Caller -> EchoResponse -> caller only</text>
  <text x="316" y="710" class="code">All    -> BroadcastMessage -> every connected client</text>
  <text x="316" y="737" class="code">Group  -> GroupMessage -> members of groupName</text>
  <text x="316" y="764" class="code">Client -> EchoResponse -> one connectionId</text>
  <text x="316" y="808" class="code muted">ConnectionId is per connection and can change after reconnect.</text>
