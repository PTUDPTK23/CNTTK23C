<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Edo period Japanese katana">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1c1a26"/>
      <stop offset=".55" stop-color="#0a0810"/>
      <stop offset="1" stop-color="#03040a"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset=".45" stop-color="#94a3b8"/>
      <stop offset=".55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="hilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2942"/>
      <stop offset=".5" stop-color="#0b1322"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e7b4"/>
      <stop offset=".5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#8a6a1c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="600" cy="450" r="320" fill="none" stroke="#d4af37" stroke-opacity=".13"/>
  <circle cx="600" cy="450" r="260" fill="none" stroke="#22d3ee" stroke-opacity=".08" stroke-dasharray="2 14"/>
  <path d="M120 760h960" stroke="#d4af37" stroke-opacity=".2"/>

  <g transform="translate(600 450) rotate(-24)">
    <path d="M-430 26 L300 -30 L300 6 L-430 62 Z" fill="url(#blade)"/>
    <path d="M-430 32 L300 -24" stroke="#f8fafc" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/>
    <path d="M-430 52 L280 8" stroke="#0b1018" stroke-opacity=".35" stroke-width="2"/>

    <path d="M300 -30 L330 -34 L330 10 L300 6 Z" fill="url(#gold)"/>
    <rect x="330" y="-24" width="26" height="34" rx="6" fill="#0b0805" stroke="#d4af37"/>

    <path d="M356 -18 C400 -70 450 -60 470 -10 C450 40 400 52 356 18 Z" fill="url(#gold)" opacity=".9"/>
    <rect x="356" y="-22" width="330" height="36" rx="14" fill="url(#hilt)"/>
    <g stroke="#d4af37" stroke-opacity=".75" stroke-width="3">
      <path d="M380 -18 L410 10 M410 -18 L440 10 M440 -18 L470 10 M470 -18 L500 10 M500 -18 L530 10 M530 -18 L560 10 M560 -18 L590 10 M590 -18 L620 10 M620 -18 L650 10"/>
    </g>
    <circle cx="686" cy="-4" r="20" fill="url(#gold)"/>
    <circle cx="686" cy="-4" r="8" fill="#0b0805"/>
  </g>

  <g font-family="Helvetica, sans-serif">
    <text x="80" y="120" font-size="13" letter-spacing="7" fill="#67e8f9" opacity=".75">EDO · KATANA</text>
    <text x="80" y="152" font-size="12" letter-spacing="4" fill="#94a3b8" opacity=".5">SIGNED TANG · 17TH CENTURY</text>
  </g>
</svg>
