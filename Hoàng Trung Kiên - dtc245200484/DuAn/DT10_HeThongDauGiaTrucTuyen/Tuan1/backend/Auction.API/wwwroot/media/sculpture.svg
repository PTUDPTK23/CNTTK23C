<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Obsidian sculpture Aurora">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="68%">
      <stop offset="0" stop-color="#1a1c2b"/>
      <stop offset=".6" stop-color="#0a0d16"/>
      <stop offset="1" stop-color="#03050a"/>
    </radialGradient>
    <linearGradient id="obs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset=".45" stop-color="#0e1626"/>
      <stop offset=".8" stop-color="#1b2942"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset=".5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="600" cy="420" r="300" fill="#22d3ee" opacity=".06" filter="url(#glow)"/>
  <circle cx="600" cy="430" r="320" fill="none" stroke="#d4af37" stroke-opacity=".14"/>
  <path d="M120 660h960" stroke="#d4af37" stroke-opacity=".25"/>

  <g transform="translate(600 430)">
    <path d="M-40 -300 L150 -180 L210 40 L80 260 L-120 300 L-240 60 L-190 -190 Z" fill="url(#obs)"/>
    <path d="M-40 -300 L60 -40 L-120 300" fill="none" stroke="url(#edge)" stroke-opacity=".55" stroke-width="3"/>
    <path d="M150 -180 L60 -40 L210 40" fill="none" stroke="url(#edge)" stroke-opacity=".4" stroke-width="2"/>
    <path d="M-240 60 L60 -40 L80 260" fill="none" stroke="#67e8f9" stroke-opacity=".22" stroke-width="2"/>
    <path d="M-190 -190 L-40 -120 L-120 -20 L-240 60" fill="none" stroke="#efd794" stroke-opacity=".18"/>
    <ellipse cx="20" cy="40" rx="90" ry="160" fill="#22d3ee" opacity=".07"/>
  </g>

  <rect x="430" y="742" width="340" height="18" rx="9" fill="#0b1322"/>
  <rect x="470" y="760" width="260" height="10" rx="5" fill="#080e1a"/>
  <path d="M470 764h260" stroke="#d4af37" stroke-opacity=".5"/>

  <g font-family="Helvetica, sans-serif" fill="#94a3b8">
    <text x="80" y="120" font-size="13" letter-spacing="7" fill="#67e8f9" opacity=".7">LOT · AURORA</text>
    <text x="80" y="150" font-size="12" letter-spacing="4" opacity=".45">OBSIDIAN · 2024</text>
  </g>
  <g stroke="#d4af37" stroke-opacity=".4">
    <path d="M80 780h120M1000 780h120"/>
  </g>
</svg>
