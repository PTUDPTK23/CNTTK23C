<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Midnight Noir wristwatch">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#14233a"/>
      <stop offset=".55" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e7b4"/>
      <stop offset=".48" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#8a6a1c"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101a2c"/>
      <stop offset=".5" stop-color="#1b2942"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
    <radialGradient id="dial" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1d3a5c"/>
      <stop offset=".6" stop-color="#0a1524"/>
      <stop offset="1" stop-color="#050a12"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="600" cy="450" r="360" fill="none" stroke="#d4af37" stroke-opacity=".12"/>
  <circle cx="600" cy="450" r="300" fill="none" stroke="#22d3ee" stroke-opacity=".10" stroke-dasharray="2 14"/>
  <circle cx="600" cy="450" r="430" fill="#d4af37" opacity=".05" filter="url(#glow)"/>

  <rect x="536" y="96" width="128" height="250" rx="34" fill="url(#strap)"/>
  <rect x="536" y="554" width="128" height="250" rx="34" fill="url(#strap)"/>
  <g stroke="#d4af37" stroke-opacity=".35">
    <path d="M552 150h96M552 190h96M552 230h96M552 270h96"/>
    <path d="M552 630h96M552 670h96M552 710h96M552 750h96"/>
  </g>

  <circle cx="600" cy="450" r="240" fill="url(#gold)"/>
  <circle cx="600" cy="450" r="214" fill="#0b1322"/>
  <circle cx="600" cy="450" r="196" fill="url(#dial)"/>
  <circle cx="600" cy="450" r="196" fill="none" stroke="#67e8f9" stroke-opacity=".28"/>

  <g stroke="#efd794" stroke-width="4" stroke-linecap="round">
    <path d="M600 286v30M600 584v30M436 450h30M734 450h30"/>
    <path d="M716 334l-19 19M503 547l-19 19M716 566l-19-19M503 353l-19-19" stroke-opacity=".7"/>
  </g>
  <g fill="#67e8f9" opacity=".85">
    <circle cx="600" cy="312" r="6"/>
    <circle cx="600" cy="588" r="6"/>
    <circle cx="462" cy="450" r="6"/>
    <circle cx="738" cy="450" r="6"/>
  </g>

  <g transform="rotate(32 600 450)">
    <rect x="592" y="330" width="16" height="130" rx="8" fill="#f6e7b4"/>
  </g>
  <g transform="rotate(118 600 450)">
    <rect x="594" y="360" width="12" height="110" rx="6" fill="#d4af37"/>
  </g>
  <circle cx="600" cy="450" r="14" fill="url(#gold)"/>
  <circle cx="600" cy="450" r="5" fill="#04060c"/>

  <text x="600" y="392" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="12" fill="#efd794" opacity=".85">AURELIA</text>
  <text x="600" y="536" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="16" letter-spacing="6" fill="#67e8f9" opacity=".6">GENÈVE · 18K</text>

  <g transform="translate(600 776)" fill="#d4af37" opacity=".55">
    <circle cx="0" cy="0" r="3"/>
    <path d="M-40 0h24M16 0h24" stroke="#d4af37" stroke-width="1"/>
  </g>
</svg>
