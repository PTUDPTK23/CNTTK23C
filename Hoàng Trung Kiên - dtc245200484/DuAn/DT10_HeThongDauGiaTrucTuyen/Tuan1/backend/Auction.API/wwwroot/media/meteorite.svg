<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Lunar meteorite fragment">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset=".55" stop-color="#080c14"/>
      <stop offset="1" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="rock" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#9aa6b5"/>
      <stop offset=".35" stop-color="#4a5568"/>
      <stop offset=".75" stop-color="#2d3748"/>
      <stop offset="1" stop-color="#161d29"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <g fill="#e2e8f0">
    <circle cx="180" cy="180" r="2" opacity=".8"/>
    <circle cx="320" cy="110" r="1.5" opacity=".6"/>
    <circle cx="980" cy="150" r="2" opacity=".7"/>
    <circle cx="1060" cy="300" r="1.5" opacity=".5"/>
    <circle cx="140" cy="420" r="1.2" opacity=".5"/>
    <circle cx="920" cy="520" r="1.5" opacity=".4"/>
    <circle cx="760" cy="120" r="1" opacity=".6"/>
    <circle cx="420" cy="260" r="1" opacity=".4"/>
  </g>
  <circle cx="600" cy="450" r="330" fill="#22d3ee" opacity=".07" filter="url(#glow)"/>
  <circle cx="600" cy="450" r="320" fill="none" stroke="#d4af37" stroke-opacity=".16"/>

  <g transform="translate(600 450)">
    <path d="M-200 -30 L-160 -150 L-40 -220 L100 -200 L210 -100 L230 40 L160 180 L20 230 L-120 200 L-210 90 Z" fill="url(#rock)"/>
    <path d="M-160 -150 L-40 -60 L-200 -30 M-40 -220 L-40 -60 L100 -140 M-40 -60 L100 -20 L210 -100 M-40 -60 L-120 60 L-210 90 M-40 -60 L20 230 M-40 -60 L160 180 L230 40"
      fill="none" stroke="#0b1018" stroke-opacity=".6" stroke-width="3"/>
    <g fill="#0b1018" opacity=".55">
      <ellipse cx="-100" cy="-120" rx="22" ry="14"/>
      <ellipse cx="80" cy="60" rx="34" ry="20"/>
      <ellipse cx="-140" cy="60" rx="18" ry="12"/>
      <ellipse cx="130" cy="-60" rx="16" ry="10"/>
    </g>
    <path d="M-40 -220 L100 -200 L210 -100" fill="none" stroke="#67e8f9" stroke-opacity=".35" stroke-width="2"/>
    <ellipse cx="0" cy="20" rx="120" ry="70" fill="#22d3ee" opacity=".05"/>
  </g>

  <ellipse cx="600" cy="704" rx="250" ry="34" fill="#05080f" opacity=".8"/>
  <path d="M360 704h480" stroke="#22d3ee" stroke-opacity=".25"/>

  <g font-family="Helvetica, sans-serif">
    <text x="80" y="120" font-size="13" letter-spacing="7" fill="#67e8f9" opacity=".75">LUNAR · FRAGMENT</text>
    <text x="80" y="152" font-size="12" letter-spacing="4" fill="#94a3b8" opacity=".5">CATALOGUED · 2.4 KG</text>
  </g>
