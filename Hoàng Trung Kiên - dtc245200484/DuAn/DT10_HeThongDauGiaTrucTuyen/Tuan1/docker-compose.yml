name: aurelia

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auctiondb
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auction_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auctiondb"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: auction
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-auction_dev_password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  api:
    build:
      context: ./backend
      args:
        PROJECT: Auction.API/Auction.API.csproj
        ASSEMBLY: Auction.API
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=auctiondb;Username=auction;Password=${POSTGRES_PASSWORD:-auction_dev_password}
      Jwt__Key: ${JWT_KEY:-dev-only-signing-key-change-me-online-auction-2026}
      InternalApi__Key: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: auction
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-auction_dev_password}
      BidValidation__Address: http://grpc:5101
      Cors__Origins__0: http://localhost:5173
      Cors__Origins__1: http://127.0.0.1:5173
      Database__AutoMigrate: "true"
      Swagger__Enabled: "true"
    ports:
      - "5100:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  grpc:
    build:
      context: ./backend
      args:
        PROJECT: BidValidation.Service/BidValidation.Service.csproj
        ASSEMBLY: BidValidation.Service
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=auctiondb;Username=auction;Password=${POSTGRES_PASSWORD:-auction_dev_password}
      Grpc__Port: "5101"
    ports:
      - "5101:5101"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  hubconsumer:
    build:
      context: ./backend
      args:
        PROJECT: Auction.HubConsumer/Auction.HubConsumer.csproj
        ASSEMBLY: Auction.HubConsumer
    environment:
      PORT: "5102"
      AUCTION_API_URL: http://api:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: auction
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-auction_dev_password}
    ports:
      - "5102:5102"
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  auditworker:
    build:
      context: ./backend
      args:
        PROJECT: Auction.AuditWorker/Auction.AuditWorker.csproj
        ASSEMBLY: Auction.AuditWorker
    environment:
      PORT: "5103"
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=auctiondb;Username=auction;Password=${POSTGRES_PASSWORD:-auction_dev_password}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: auction
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-auction_dev_password}
    ports:
      - "5103:5103"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:5100}
        VITE_HUB_URL: ${PUBLIC_API_URL:-http://localhost:5100}/hubs/auction
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
